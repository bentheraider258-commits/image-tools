<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageTools Elite</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#f5f7fb;
}

header {
  text-align:center;
  padding:20px;
  font-size:26px;
  font-weight:bold;
}

.container {
  max-width:850px;
  margin:auto;
  padding:20px;
}

.upload {
  border:2px dashed #6366f1;
  padding:40px;
  border-radius:15px;
  background:white;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.upload:hover { background:#eef2ff; }

.preview img {
  max-width:100%;
  margin-top:20px;
  border-radius:10px;
}

.tabs {
  margin-top:20px;
  text-align:center;
}

.tabs button {
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#ddd;
  cursor:pointer;
}

.tabs .active {
  background:#6366f1;
  color:white;
}

.tool-box {
  display:none;
  background:white;
  padding:20px;
  margin-top:15px;
  border-radius:10px;
}

.tool-box.active { display:block; }

input, select {
  padding:8px;
  margin:5px;
}

button.action {
  background:#6366f1;
  color:white;
  border:none;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}

canvas {
  max-width:100%;
  margin-top:20px;
}

.ad {
  margin:20px 0;
  padding:20px;
  background:#eee;
  text-align:center;
}
</style>
</head>

<body>

<header>ImageTools Elite</header>

<div class="container">

<div class="upload" onclick="fileInput.click()">
  Drag & Drop Image or Click to Upload
  <input type="file" id="fileInput" hidden>
</div>

<div class="preview">
  <img id="previewImg">
</div>

<div class="tabs">
  <button onclick="switchTab('resize')" class="active">Resize</button>
  <button onclick="switchTab('compress')">Compress</button>
  <button onclick="switchTab('convert')">Convert</button>
  <button onclick="switchTab('crop')">Crop</button>
</div>

<!-- RESIZE -->
<div id="resize" class="tool-box active">
  Width <input id="width">
  Height <input id="height"><br>

  <h4>Presets</h4>
  <button onclick="preset(1080,1080)">Instagram</button>
  <button onclick="preset(1280,720)">YouTube</button>
  <button onclick="preset(512,512)">Profile</button><br>

  <button class="action" onclick="resize()">Apply</button>
</div>

<!-- COMPRESS -->
<div id="compress" class="tool-box">
  Quality <input type="range" id="quality" min="0.1" max="1" step="0.1" value="0.7">
  <button class="action" onclick="compress()">Apply</button>
</div>

<!-- CONVERT -->
<div id="convert" class="tool-box">
  <select id="format">
    <option value="image/png">PNG</option>
    <option value="image/jpeg">JPG</option>
  </select>
  <button class="action" onclick="convert()">Apply</button>
</div>

<!-- CROP -->
<div id="crop" class="tool-box">
  X <input id="cropX">
  Y <input id="cropY"><br>
  Width <input id="cropW">
  Height <input id="cropH"><br>
  <button class="action" onclick="crop()">Apply</button>
</div>

<div class="ad">Ad Space (Top)</div>

<canvas id="canvas"></canvas>
<a id="download"></a>

<div class="ad">Ad Space (Bottom)</div>

</div>

<script>
let img = new Image();
fileInput.onchange = e=>{
  img.src = URL.createObjectURL(e.target.files[0]);
  previewImg.src = img.src;
};

function switchTab(id){
  document.querySelectorAll('.tool-box').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

function preset(w,h){
  width.value=w;
  height.value=h;
}

function resize(){
  img.onload=()=>{
    canvas.width=width.value||img.width;
    canvas.height=height.value||img.height;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    download();
  }
}

function compress(){
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    canvas.getContext('2d').drawImage(img,0,0);
    download(canvas.toDataURL('image/jpeg',quality.value));
  }
}

function convert(){
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    canvas.getContext('2d').drawImage(img,0,0);
    download(canvas.toDataURL(format.value));
  }
}

function crop(){
  img.onload=()=>{
    canvas.width=cropW.value;
    canvas.height=cropH.value;
    canvas.getContext('2d').drawImage(img,cropX.value,cropY.value,cropW.value,cropH.value,0,0,cropW.value,cropH.value);
    download();
  }
}

function download(url){
  let link=document.getElementById("download");
  link.href=url||canvas.toDataURL();
  link.download="image.png";
  link.innerText="Download Image";
}
</script>

</body>
</html>
