<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resizer Pro</title>

<style>
body {
  font-family: Arial;
  background:#f5f7fb;
  text-align:center;
}

.container {
  max-width:600px;
  margin:auto;
  padding:20px;
}

.upload {
  border:2px dashed #4f46e5;
  padding:30px;
  border-radius:10px;
  background:white;
  cursor:pointer;
}

input {
  padding:8px;
  margin:5px;
  width:100px;
}

button {
  padding:10px;
  background:#4f46e5;
  color:white;
  border:none;
  border-radius:6px;
}

canvas {
  max-width:100%;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h2>Resize Image</h2>

<div class="upload" onclick="fileInput.click()">
  Upload Image
  <input type="file" id="fileInput" hidden>
</div>

<br>

Width: <input id="width">
Height: <input id="height"><br>

Percentage: <input id="percent" value="100"> %

<br><br>

<button onclick="applyResize()">Apply</button>

<canvas id="canvas"></canvas>
<a id="download"></a>

</div>

<script>
let img = new Image();
let originalW, originalH;

fileInput.onchange = e=>{
  img.src = URL.createObjectURL(e.target.files[0]);

  img.onload = ()=>{
    originalW = img.width;
    originalH = img.height;

    width.value = originalW;
    height.value = originalH;
    percent.value = 100;

    drawPreview(originalW, originalH);
  }
};

// Sync width/height → percent
width.oninput = ()=>{
  percent.value = Math.round((width.value / originalW)*100);
  height.value = Math.round((width.value / originalW)*originalH);
  drawPreview(width.value, height.value);
};

height.oninput = ()=>{
  percent.value = Math.round((height.value / originalH)*100);
  width.value = Math.round((height.value / originalH)*originalW);
  drawPreview(width.value, height.value);
};

// Sync percent → width/height
percent.oninput = ()=>{
  let scale = percent.value / 100;
  width.value = Math.round(originalW * scale);
  height.value = Math.round(originalH * scale);
  drawPreview(width.value, height.value);
};

// Draw preview
function drawPreview(w,h){
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(img,0,0,w,h);
}

// Apply final
function applyResize(){
  let link = document.getElementById("download");
  link.href = canvas.toDataURL();
  link.download = "resized.png";
  link.innerText = "Download Image";
}
</script>

</body>
</html>
